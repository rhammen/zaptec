stop_charging:
  name: Stop charging
  description: >-
    Stop or pauses the active charging. Select either charger device(s)
    or specify the charger_id directly
  fields:
    device_id:
      description: Select charger device
      selector:
        device:
          integration: zaptec
    charger_id:
      description: Charger identifier
      example: 00000000-1111-2222-3333-444444444444

resume_charging:
  name: Resume charging
  description: >-
    Resume or start charging. Select either charger device(s) or
    specify the charger_id directly
  fields:
    device_id:
      description: Select charger device
      selector:
        device:
          integration: zaptec
    charger_id:
      description: Charger identifier
      example: 00000000-1111-2222-3333-444444444444

authorize_charging:
  name: Authorize charging
  description: >-
    Authorize the charge session and resume charging. Select charger
    device(s) or specify the charger_id directly.
  fields:
    device_id:
      description: Select charger device
      selector:
        device:
          integration: zaptec
    charger_id:
      description: Charger identifier
      example: 00000000-1111-2222-3333-444444444444

deauthorize_charging:
  name: Deauthorize charging
  description: >-
    Deauthorize the session and stop charging. Select charger device(s)
    or specify the charger_id directly.
  fields:
    device_id:
      description: Select charger device
      selector:
        device:
          integration: zaptec
    charger_id:
      description: Charger identifier
      example: 00000000-1111-2222-3333-444444444444

restart_charger:
  name: Restart charger
  description: >-
    Restart the charger. Select charger device(s) or specify the
    charger_id directly.
  fields:
    device_id:
      description: Select charger device
      selector:
        device:
          integration: zaptec
    charger_id:
      description: Charger identifier
      example: 00000000-1111-2222-3333-444444444444

upgrade_firmware:
  name: Update firmware
  description: >-
    Send update firmware request to the charger. Select charger
    device(s) or specify the charger_id directly.
  fields:
    device_id:
      description: Select charger device
      selector:
        device:
          integration: zaptec
    charger_id:
      description: Charger identifier
      example: 00000000-1111-2222-3333-444444444444

limit_current:
  name: Set current limit
  description: >-
    Set the available current for the installation. Select installation
    device(s) or specify the installation_id directly. The available
    current can either be using the available_current or the
    available_current_phasex fields. All three phases must be present.
  fields:
    device_id:
      description: Select installation device
      selector:
        device:
          integration: zaptec
    installation_id:
      description: Installer identifier
      example: 00000000-1111-2222-3333-444444444444
    available_current:
      description: The available current for all phases. Cannot be used together with any available_current_phase* fields
      example: 16
      selector:
        number:
          min: 0
          max: 32
    available_current_phase1:
      description: The available current for phase 1
      example: 16
      selector:
        number:
          min: 0
          max: 32
    available_current_phase2:
      description: The available current for phase 2
      example: 16
      selector:
        number:
          min: 0
          max: 32
    available_current_phase3:
      description: The available current for phase 3
      example: 16
      selector:
        number:
          min: 0
          max: 32

send_command:
  name: Send command
  description: >-
    Send command to the charger. Select charger device(s) or specify the
    charger_id directly.
  fields:
    device_id:
      description: Select charger device
      selector:
        device:
          integration: zaptec
    charger_id:
      description: Charger identifier
      example: 00000000-1111-2222-3333-444444444444
    command:
      description: Charger command. Either string or integer.
      example: "StopChargingFinal"

raw_api_request:
  name: Raw API request
  description: >-
    Advanced/unsupported: only use this if you know exactly what you're
    doing. This sends a request straight to the Zaptec API through this
    integration's authenticated session, with NO validation of the
    endpoint, method, or payload — including whether the device you select
    (installation vs. charger) actually matches what the path targets. You
    are fully responsible for every setting on this call. It may hit
    undocumented API surface that can change or break without warning, and
    that Zaptec's API fair-use policy discourages relying on. See
    DEVELOPMENT.md for example calls.
  fields:
    device_id:
      description: >-
        Select charger or installation device. Must match the device type
        the chosen path targets (e.g. an installation device for
        installation/{id}/... paths) — this is not checked for you.
      selector:
        device:
          integration: zaptec
    charger_id:
      description: Charger identifier
      example: 00000000-1111-2222-3333-444444444444
    installation_id:
      description: Installation identifier
      example: 00000000-1111-2222-3333-444444444444
    path:
      description: >-
        Relative API path. A literal {id} is replaced with the resolved
        charger/installation's own id.
      example: "installation/{id}/update"
    method:
      description: HTTP method.
      example: "PUT"
      selector:
        select:
          options:
            - "GET"
            - "POST"
            - "PUT"
    data:
      description: JSON request body (optional, e.g. for POST/PUT).
      example: '{"EnabledFeatures": 12}'
